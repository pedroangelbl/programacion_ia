<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictor de Calidad de Vinos</title>
    <style>
        :root {
            --primary: #deff9a;
            --bg: #121212;
            --card: #1e1e1e;
            --text: #f5f5f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background-color: var(--card);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #bbb;
        }

        input {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        .full-width {
            grid-column: span 2;
            margin-top: 20px;
        }

        button {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        #resultado-container {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            background: rgba(222, 255, 154, 0.1);
            display: none;
        }

        .score {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Analizador Enológico</h2>
    
    <div class="grid-form">
        <div class="input-group">
            <label>Fixed Acidity</label>
            <input type="number" id="f1" step="0.1" value="7.4">
        </div>
        <div class="input-group">
            <label>Volatile Acidity</label>
            <input type="number" id="f2" step="0.01" value="0.70">
        </div>
        <div class="input-group">
            <label>Citric Acid</label>
            <input type="number" id="f3" step="0.01" value="0.00">
        </div>
        <div class="input-group">
            <label>Residual Sugar</label>
            <input type="number" id="f4" step="0.1" value="1.9">
        </div>
        <div class="input-group">
            <label>Chlorides</label>
            <input type="number" id="f5" step="0.001" value="0.076">
        </div>
        <div class="input-group">
            <label>Free Sulfur Dioxide</label>
            <input type="number" id="f6" step="1" value="11">
        </div>
        <div class="input-group">
            <label>Total Sulfur Dioxide</label>
            <input type="number" id="f7" step="1" value="34">
        </div>
        <div class="input-group">
            <label>Density</label>
            <input type="number" id="f8" step="0.0001" value="0.9978">
        </div>
        <div class="input-group">
            <label>pH</label>
            <input type="number" id="f9" step="0.01" value="3.51">
        </div>
        <div class="input-group">
            <label>Sulphates</label>
            <input type="number" id="f10" step="0.01" value="0.56">
        </div>
        <div class="input-group full-width">
            <label>Alcohol (% vol)</label>
            <input type="number" id="f11" step="0.1" value="9.4">
        </div>
        
        <div class="full-width">
            <button onclick="predecirCalidad()">PREDECIR CALIDAD</button>
        </div>
    </div>

    <div id="resultado-container">
        <span style="font-size: 0.9rem; color: #bbb;">Calidad Estimada:</span>
        <span id="score" class="score">--</span>
    </div>
</div>

<script>
    async function predecirCalidad() {
        const btn = document.querySelector('button');
        const resDiv = document.getElementById('resultado-container');
        const scoreSpan = document.getElementById('score');
        
        // 1. Recopilar los 11 valores
        const features = [];
        for (let i = 1; i <= 11; i++) {
            const val = parseFloat(document.getElementById('f' + i).value);
            features.push(val);
        }

        btn.innerText = "PROCESANDO...";
        btn.disabled = true;

        try {
            // 2. Llamada a la API de FastAPI
            const response = await fetch('http://127.0.0.1:8000/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ "features": features })
            });

            if (!response.ok) throw new Error('Error en la API');

            const data = await response.json();
            
            // 3. Mostrar resultados
            resDiv.style.display = 'block';
            const finalScore = data.quality.toFixed(2);
            scoreSpan.innerText = finalScore;
        } catch (error) {
            alert("Error: Asegúrate de que el servidor FastAPI esté corriendo en http://127.0.0.1:8000");
            console.error(error);
        } finally {
            btn.innerText = "PREDECIR CALIDAD";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
